# Builds static dash (6_static_dash/web) and publishes it on GitHub Pages, for the presentation QR code.
# Runs when anything in 6_static_dash/ changes on main, or by hand from the Actions tab (Run workflow).
# Needs Settings -> Pages -> Source set to "GitHub Actions" once.
name: Deploy static dash
on:
  push:
    branches: [main]
    paths: ["6_static_dash/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 6_static_dash/web/package-lock.json
      - name: Build
        run: npm ci && npm run build
        working-directory: 6_static_dash/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 6_static_dash/web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
